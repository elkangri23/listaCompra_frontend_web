name: CI

# Lint + tests unitarios + tests E2E en cada push y PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar runs obsoletos de la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

  unit-tests:
    name: Tests unitarios (Jest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios con coverage
        run: npm run test:ci

      - name: Subir reporte de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-24.04
    env:
      # El build necesita el secret de NextAuth y la URL del mock API
      NEXTAUTH_SECRET: ci-secret-solo-para-tests-e2e
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        # Playwright levanta el mock API (3333) y el build de producción (3000)
        run: npx playwright test

      - name: Subir reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
